<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e2e-architecture-title e2e-architecture-desc" id="e2e_architecture-root">
        <title id="e2e-architecture-title">End-to-End arXiv Scientific Data Pipeline</title>
        <desc id="e2e-architecture-desc">Three-stage data engineering architecture spanning multi-version arXiv acquisition, LaTeX parsing with cross-version deduplication, and supervised citation matching published as six columnar tables.</desc>
        <defs>
      <style>#e2e_architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #e2e_architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #e2e_architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#e2e_architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="e2e_architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="e2e_architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="e2e_architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Stage Zones (drawn first) -->
        <rect x="48" y="48" width="344" height="536" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="140" y="52" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">STAGE 1 · ACQUISITION</text>

        <rect x="464" y="48" width="352" height="536" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="548" y="52" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">STAGE 2 · PARSING &amp; DEDUP</text>

        <rect x="888" y="48" width="344" height="536" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="964" y="52" width="192" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1060" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">STAGE 3 · MATCHING &amp; DELIVERY</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- 1. External Sources -> Multi-Version Acquisition -->
        <line x1="220" y1="176" x2="220" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-link)"/>
        <!-- 2. Multi-Version Acquisition -> Filtered Raw Archive -->
        <line x1="220" y1="340" x2="220" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow)"/>
        <!-- 3. Filtered Raw Archive -> LaTeX & BibTeX Parser (Stage 1 -> Stage 2) -->
        <path d="M 360,464 H 420 Q 428,464 428,456 V 144 Q 428,136 436,136 H 500"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow)"/>
        <!-- 4. LaTeX & BibTeX Parser -> Cross-Version Deduplication -->
        <line x1="640" y1="176" x2="640" y2="264" stroke="#bf4520" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-accent)"/>
        <!-- 5. Cross-Version Deduplication -> Structured Hierarchy Store -->
        <line x1="640" y1="340" x2="640" y2="428" stroke="#bf4520" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-accent)"/>
        <!-- 6. Structured Hierarchy Store -> Labeling & Frozen Split (Stage 2 -> Stage 3) -->
        <path d="M 780,464 H 844 Q 852,464 852,456 V 144 Q 852,136 860,136 H 920"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow)"/>
        <!-- 7. Labeling & Frozen Split -> Supervised Candidate Ranker -->
        <line x1="1060" y1="176" x2="1060" y2="264" stroke="#bf4520" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-accent)"/>
        <!-- 8. Supervised Candidate Ranker -> Published 6-Table Dataset -->
        <line x1="1060" y1="340" x2="1060" y2="428" stroke="#bf4520" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-accent)"/>
        <!-- 9. Filtered Raw Archive -> Published 6-Table Dataset (M1 tables bypass, outer channel) -->
        <path d="M 220,504 V 556 Q 220,564 228,564 H 1104 Q 1112,564 1112,556 V 504"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#e2e_architecture-arrow)"/>
        <!-- 10. Structured Hierarchy Store -> Published 6-Table Dataset (M2 tables bypass, inner channel) -->
        <path d="M 640,504 V 528 Q 640,536 648,536 H 1000 Q 1008,536 1008,528 V 504"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#e2e_architecture-arrow)"/>

        <!-- Arrow Labels (opaque mask + 8px gap from stroke) -->
        <rect x="228" y="214" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="223" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">RATE-LIMITED</text>

        <rect x="228" y="378" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">FILTER -94%</text>

        <rect x="436" y="214" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TEX &amp; REFS</text>

        <rect x="648" y="214" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="688" y="223" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">KEY REWRITE</text>

        <rect x="648" y="378" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="690" y="387" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">SHARED NODES</text>

        <rect x="860" y="214" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="898" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">BIBTEX POOL</text>

        <rect x="1068" y="214" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1114" y="223" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TRAIN-ONLY FIT</text>

        <rect x="1068" y="378" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1104" y="387" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TOP-5 RANK</text>

        <rect x="392" y="544" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="553" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">M1 TABLES</text>

        <rect x="816" y="516" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="852" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">M2 TABLES</text>

        <!-- Nodes (drawn after arrows and labels) -->
        <!-- Node 1: External Sources & APIs -->
        <rect x="80" y="100" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="100" width="280" height="76" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="88" y="108" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.35"/>
        <text x="104" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="220" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">External Sources &amp; APIs</text>
        <text x="220" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">arXiv API · OAI-PMH · S2</text>

        <!-- Node 2: Multi-Version Acquisition -->
        <rect x="80" y="264" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="264" width="280" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="272" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="110" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">CRAWL</text>
        <text x="220" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Multi-Version Acquisition</text>
        <text x="220" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">25,000 papers · 40,896 versions</text>

        <!-- Node 3: Filtered Raw Archive -->
        <rect x="80" y="428" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="428" width="280" height="76" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="88" y="436" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="110" y="445" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="220" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Filtered Raw Archive</text>
        <text x="220" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">-93.8% size · 466.8K refs</text>

        <!-- Node 4: LaTeX & BibTeX Parser -->
        <rect x="500" y="100" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="100" width="280" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="508" y="108" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="530" y="117" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">PARSE</text>
        <text x="640" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">LaTeX &amp; BibTeX Parser</text>
        <text x="640" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">37,967 versions · 975K BibTeX</text>

        <!-- Node 5: Cross-Version Deduplication (FOCAL CORAL 1) -->
        <rect x="500" y="264" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="264" width="280" height="76" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="508" y="272" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="530" y="281" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
        <text x="640" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Cross-Version Deduplication</text>
        <text x="640" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">11.10M elements · -31.6%</text>

        <!-- Node 6: Structured Hierarchy Store -->
        <rect x="500" y="428" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="428" width="280" height="76" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="508" y="436" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="530" y="445" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="640" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Structured Hierarchy Store</text>
        <text x="640" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">16.19M edges · 1.09 GiB</text>

        <!-- Node 7: Labeling & Frozen Split -->
        <rect x="920" y="100" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="100" width="280" height="76" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="928" y="108" width="44" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="950" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">SPLIT</text>
        <text x="1060" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Labeling &amp; Frozen Split</text>
        <text x="1060" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">2,525 pool · 101.4K entries</text>

        <!-- Node 8: Supervised Candidate Ranker (FOCAL CORAL 2) -->
        <rect x="920" y="264" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="264" width="280" height="76" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="928" y="272" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="950" y="281" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
        <text x="1060" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Supervised Candidate Ranker</text>
        <text x="1060" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">24 features · MRR@5 = 1.000</text>

        <!-- Node 9: Published 6-Table Dataset -->
        <rect x="920" y="428" width="280" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="428" width="280" height="76" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="928" y="436" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="954" y="445" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">PARQUET</text>
        <text x="1060" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Published 6-Table Dataset</text>
        <text x="1060" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">1.17 GiB · 0 audit errors</text>

        <!-- Horizontal Legend Strip -->
        <line x1="48" y1="620" x2="1232" y2="620" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="48" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="132" y="634" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="156" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Focal architectural stage</text>

        <line x1="364" y1="640" x2="396" y2="640" stroke="#bf4520" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-accent)"/>
        <text x="404" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Primary data transform</text>

        <line x1="596" y1="640" x2="628" y2="640" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#e2e_architecture-arrow-link)"/>
        <text x="636" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">External API ingest</text>

        <line x1="820" y1="640" x2="852" y2="640" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#e2e_architecture-arrow)"/>
        <text x="860" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Direct Parquet table delivery</text>
      </svg>
