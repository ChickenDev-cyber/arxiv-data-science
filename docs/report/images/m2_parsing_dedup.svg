<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m2-parsing-dedup-title m2-parsing-dedup-desc" id="m2_parsing_dedup-root">
        <title id="m2-parsing-dedup-title">Milestone 2 Ordered LaTeX Parsing and Deduplication</title>
        <desc id="m2-parsing-dedup-desc">Strictly ordered parsing pipeline gathering compilation paths, unifying references, rewriting citation keys before text cleanup, building hierarchical trees, and deduplicating elements across versions.</desc>
        <defs>
      <style>#m2_parsing_dedup-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #m2_parsing_dedup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #m2_parsing_dedup-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#m2_parsing_dedup-root .diagram-container { overflow-x: visible; }
}</style>
