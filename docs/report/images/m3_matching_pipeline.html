<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 3 Leakage-Free Citation Matching Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">MILESTONE 3 · LEAKAGE-FREE CITATION MATCHING</p>
    <h1>Supervised Reference Matching and Held-Out Evaluation Pipeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m3-matching-pipeline-title m3-matching-pipeline-desc">
        <title id="m3-matching-pipeline-title">Milestone 3 Leakage-Free Citation Matching Pipeline</title>
        <desc id="m3-matching-pipeline-desc">Supervised citation matching pipeline isolating publication-level splits and train-only feature fitting from held-out validation, testing, and six-table sharded delivery.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Three Vertical Zones (Zone 2 carries dashed no-leakage boundary) -->
        <rect x="44" y="48" width="336" height="536" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="120" y="52" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">GROUND-TRUTH &amp; SPLITTING</text>

        <rect x="456" y="48" width="360" height="536" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.34)" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="538" y="52" width="196" height="12" rx="2" fill="#f5f5f5"/>
        <text x="636" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">TRAIN-ONLY ENGINE · NO LEAKAGE</text>

        <rect x="904" y="48" width="336" height="536" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="982" y="52" width="180" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1072" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">EVALUATION &amp; DELIVERY</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- 1. Manual & Auto Labeling -> Frozen Publication Split -->
        <line x1="212" y1="168" x2="212" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. Frozen Publication Split -> Within-Paper Candidate Grid -->
        <line x1="212" y1="340" x2="212" y2="432" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 3. Within-Paper Candidate Grid -> Train-Only TF-IDF & 24 Features (Train partition) -->
        <path d="M 352,468 H 408 Q 416,468 416,460 V 140 Q 416,132 424,132 H 488"
              fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 4. Train-Only TF-IDF & 24 Features -> 5-Fold Group CV Selection -->
        <line x1="636" y1="168" x2="636" y2="260" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 5. 5-Fold Group CV Selection -> ID-Masking & Ablation Audits -->
        <line x1="636" y1="340" x2="636" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 6. 5-Fold Group CV Selection -> Top-5 Deterministic Ranker (Frozen model weights) -->
        <path d="M 784,300 H 832 Q 840,300 840,292 V 124 Q 840,116 848,116 H 932"
              fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 7. Within-Paper Candidate Grid -> Top-5 Deterministic Ranker (Held-out Val/Test bypass!) -->
        <path d="M 212,504 V 548 Q 212,556 220,556 H 868 Q 876,556 876,548 V 156 Q 876,148 884,148 H 932"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <!-- 8. Top-5 Deterministic Ranker -> Held-Out MRR@5 Audit -->
        <line x1="1072" y1="168" x2="1072" y2="260" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 9. Held-Out MRR@5 Audit -> 6-Table Sharded Export -->
        <line x1="1072" y1="340" x2="1072" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow Labels (opaque mask + 8px gap from stroke) -->
        <rect x="220" y="208" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="258" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">98.7% PREC</text>

        <rect x="220" y="380" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="258" y="389" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">GROUP LOCK</text>

        <rect x="424" y="112" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="454" y="121" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TRAIN SET</text>

        <rect x="644" y="208" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="682" y="217" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">24 SIGNALS</text>

        <rect x="644" y="380" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="686" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">CV STRESS</text>

        <rect x="844" y="96" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="884" y="105" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">FROZEN MODEL</text>

        <rect x="590" y="536" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="636" y="545" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">HELD-OUT BYPASS</text>

        <rect x="1080" y="208" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1122" y="217" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TOP-5 SCORES</text>

        <rect x="1080" y="380" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1120" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">101.4K ROWS</text>

        <!-- Zone 1 Nodes -->
        <!-- Node 1: Manual & Auto Labeling -->
        <rect x="72" y="96" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="96" width="280" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="80" y="104" width="44" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="102" y="113" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">LABEL</text>
        <text x="212" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Manual &amp; Auto Labeling</text>
        <text x="212" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">25 manual + 2,500 auto papers</text>

        <!-- Node 2: Frozen Publication Split (FOCAL CORAL 1) -->
        <rect x="72" y="260" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="260" width="280" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="80" y="268" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="106" y="277" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">NO-LEAK</text>
        <text x="212" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Frozen Publication Split</text>
        <text x="212" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">Train 2,505 · Val 10 · Test 10</text>

        <!-- Node 3: Within-Paper Candidate Grid -->
        <rect x="72" y="432" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="432" width="280" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="80" y="440" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="102" y="449" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">MATRIX</text>
        <text x="212" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Within-Paper Candidate Grid</text>
        <text x="212" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">m x n pairs · 1.56M train pairs</text>

        <!-- Zone 2 Nodes -->
        <!-- Node 4: Train-Only TF-IDF & 24 Features -->
        <rect x="488" y="96" width="296" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="96" width="296" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="496" y="104" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="520" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">FEATURE</text>
        <text x="636" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">5-Group Features &amp; TF-IDF</text>
        <text x="636" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">24 signals · 109.9K char terms</text>

        <!-- Node 5: 5-Fold Group CV Selection (FOCAL CORAL 2) -->
        <rect x="488" y="260" width="296" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="260" width="296" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="496" y="268" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="518" y="277" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
        <text x="636" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">5-Fold Group CV Selection</text>
        <text x="636" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">LogReg vs LambdaRank · 10 cfgs</text>

        <!-- Node 6: ID-Masking & Ablation Audits -->
        <rect x="488" y="432" width="296" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="432" width="296" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="496" y="440" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="518" y="449" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">AUDIT</text>
        <text x="636" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">ID-Masking &amp; Group Ablation</text>
        <text x="636" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">100% masked · 5 feature drops</text>

        <!-- Zone 3 Nodes -->
        <!-- Node 7: Top-5 Deterministic Ranker -->
        <rect x="932" y="96" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="932" y="96" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="940" y="104" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="962" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">INFER</text>
        <text x="1072" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Top-5 Deterministic Ranking</text>
        <text x="1072" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">LogReg C=0.1 · tie-break</text>

        <!-- Node 8: Held-Out MRR@5 Audit -->
        <rect x="932" y="260" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="932" y="260" width="280" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="940" y="268" width="44" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="962" y="277" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">METRIC</text>
        <text x="1072" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Held-Out MRR@5 Audit</text>
        <text x="1072" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">Val 1.000 · Test 1.000 · 6 errs</text>

        <!-- Node 9: 6-Table Sharded Export -->
        <rect x="932" y="432" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="932" y="432" width="280" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="940" y="440" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="966" y="449" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">PARQUET</text>
        <text x="1072" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">6-Table Sharded Export</text>
        <text x="1072" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">1.17 GiB · 0 audit issues</text>

        <!-- Horizontal Legend Strip -->
        <line x1="44" y1="620" x2="1236" y2="620" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="44" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="124" y="634" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="148" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Focal split / model selection</text>

        <rect x="372" y="634" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.34)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="396" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Train-only isolation zone</text>

        <line x1="612" y1="640" x2="644" y2="640" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <line x1="860" y1="640" x2="892" y2="640" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      </svg>
    </div>
  </div>
</body>
</html>
