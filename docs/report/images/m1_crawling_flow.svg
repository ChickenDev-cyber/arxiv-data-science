<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m1-crawling-flow-title m1-crawling-flow-desc" id="m1_crawling_flow-root">
        <title id="m1-crawling-flow-title">Milestone 1 Multi-Source Acquisition and Resilience</title>
        <desc id="m1-crawling-flow-desc">Data acquisition architecture connecting arXiv Atom, OAI-PMH, Export Mirror, and Semantic Scholar APIs through extraction-time filtering, shared rate scheduling, and two-phase atomic storage.</desc>
        <defs>
      <style>#m1_crawling_flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #m1_crawling_flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #m1_crawling_flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#m1_crawling_flow-root .diagram-container { overflow-x: visible; }
}</style>
